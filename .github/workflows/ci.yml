name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: bundle exec rake test
      - run: node --test javascript/rails_mind.test.js
      - run: bundle exec ruby script/package_smoke.rb
