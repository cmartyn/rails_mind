name: Release gem

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: rubygems-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify release tag and branch
        run: |
          ruby -r ./lib/rails_mind/version -e 'abort "Tag must match the gem version" unless ENV.fetch("GITHUB_REF_NAME") == "v#{RailsMind::VERSION}"'
          git merge-base --is-ancestor HEAD origin/main
      - run: bundle exec rake test
      - run: node --test javascript/rails_mind.test.js
      - run: bundle exec ruby script/package_smoke.rb

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: rubygems/release-gem@v1
